// crates/mpc-coordinator/proto/coordinator.proto
// ============================================================================
// MPC Coordinator gRPC API Contract
// ============================================================================
// This file defines the communication protocol for the MPC Coordinator service.
// The Coordinator acts as the central orchestrator for the Multi-Party Computation 
// (MPC) cluster, managing session state, routing messages between nodes, and 
// enforcing administrative policies.
//
// The protocol is divided into three logical domains:
// 1. Signing RPCs: Used by the API Gateway to initiate signing and by MPC Nodes 
//    to report their partial signature shares.
// 2. Admin / CLI RPCs: Used exclusively by the administrative CLI for lifecycle 
//    management, monitoring, and break-glass operations.
// 3. Frost RPCs: Used to initiate Ed25519 DKG ceremonies (e.g., for Solana).

syntax = "proto3";
package coordinator;

// ============================================================================
// 1. Signing RPCs (Shared with mpc-api and mpc-node)
// ============================================================================

/// Request to initiate a new MPC threshold signing session.
message SigningRequest {
  // A unique UUIDv4 identifying this specific signing session.
  string session_id = 1;
  
  // The 32-byte cryptographic digest (sighash) that the MPC nodes must sign.
  bytes message_hash = 2;
  
  // The elliptic curve to use for the signing operation (e.g., "secp256k1").
  string curve = 3;
  
  // The list of node indices requested to participate in the signing quorum.
  // The Coordinator's Policy Engine will use this to route the session to 
  // the appropriate healthy nodes.
  repeated uint32 signer_indices = 4;
  
  // The BIP32 derivation path of the key share to be used for signing.
  // An empty string indicates signing with the raw Master Key (Vault per DKG).
  string derivation_path = 5;
}

/// Response acknowledging that the Coordinator has accepted the signing request 
/// and has begun orchestrating the MPC nodes.
message SigningResponse {
  // True if the session was successfully initiated and routed to nodes.
  bool accepted = 1;
}

/// Message sent by an MPC node to report its partial signature share back to the Coordinator.
message SignatureReport {
  // The UUIDv4 of the signing session this report belongs to.
  string session_id = 1;
  
  // The raw partial signature bytes generated by this specific node.
  bytes signature = 2;
  
  // The unique identifier of the node submitting this report.
  uint32 party_id = 3;
}

/// Request to poll the Coordinator for the final, aggregated threshold signature.
message GetResultRequest {
  // The UUIDv4 of the signing session to check.
  string session_id = 1;
}

/// Response containing the final, fully assembled threshold signature.
message SignatureResult {
  // The raw signature bytes (e.g., 64 or 65 bytes for ECDSA, 64 bytes for EdDSA).
  bytes signature = 1;
}

/// Acknowledgment message sent by the Coordinator to MPC nodes after 
/// successfully receiving and aggregating their signature reports.
message ReportAck {}

// ============================================================================
// 2. Admin / CLI RPCs (Used exclusively by mpc-cli)
// ============================================================================

/// Request to initiate a new Distributed Key Generation (DKG) ceremony.
message StartKeygenRequest {
  // The elliptic curve to generate keys for (e.g., "secp256k1").
  string curve = 1;
  
  // The threshold (t) for the t-of-n secret sharing scheme.
  uint32 threshold = 2;
}

/// Response containing the session ID for the initiated DKG ceremony.
message StartKeygenResponse {
  // A unique UUIDv4 identifying the DKG session.
  string session_id = 1;
}

/// Request to initiate the Auxiliary Information Generation (AuxGen) phase 
/// required for CGGMP21 ECDSA threshold signing (e.g., Paillier/RSA keys).
message StartAuxGenRequest {
  // The total number of parties (n) participating in the AuxGen ceremony.
  uint32 total_parties = 1;
}

/// Response containing the session ID for the initiated AuxGen ceremony.
message StartAuxGenResponse {
  // A unique UUIDv4 identifying the AuxGen session.
  string session_id = 1;
}

/// Request to initiate a proactive key share refresh (rotation) for an existing vault.
message StartRefreshRequest {
  // The unique identifier of the vault/key to refresh.
  string key_id = 1;
}

/// Response containing the session ID for the initiated refresh ceremony.
message StartRefreshResponse {
  // A unique UUIDv4 identifying the refresh session.
  string session_id = 1;
}

/// Request to fetch the current operational status of the Coordinator and its nodes.
message GetStatusRequest {}

/// Represents the health and status of a single MPC node.
message NodeStatus {
  // The unique numeric identifier of the node.
  uint32 id = 1;
  
  // The current operational state of the node (e.g., "IDLE", "SIGNING", "ERROR").
  string status = 2;
  
  // True if the node's attached Hardware Security Module (HSM) is responsive.
  bool hsm_healthy = 3;
  
  // ISO 8601 timestamp of the last successful heartbeat/ping from this node.
  string last_ping = 4;
}

/// Response containing the aggregate status of the Coordinator cluster.
message GetStatusResponse {
  // The number of currently active MPC sessions being orchestrated.
  uint32 active_sessions = 1;
  
  // A list of all registered nodes and their current health status.
  repeated NodeStatus nodes = 2;
}

/// Request to retrieve encrypted key share backups from all registered nodes.
message RequestBackupRequest {}

/// Represents the encrypted key share backup from a single node.
message NodeBackup {
  // The unique numeric identifier of the node providing this backup.
  uint32 node_id = 1;
  
  // The HSM-wrapped (encrypted) key share blob.
  bytes encrypted_share = 2;
}

/// Response containing the collection of node backups.
message RequestBackupResponse {
  // A list of encrypted shares, one from each participating node.
  repeated NodeBackup backups = 1;
}

/// Request to execute an emergency, break-glass transaction to drain funds from a vault.
/// ⚠️ WARNING: This is a highly privileged, destructive operation.
message EmergencyDrainRequest {
  // The target blockchain network (e.g., "bitcoin", "ethereum").
  string chain = 1;
  
  // The source MPC address currently holding the funds.
  string from_address = 2;
  
  // The destination cold wallet or recovery address.
  string target_address = 3;
  
  // The BIP32 derivation path of the key to authorize the drain (e.g., "m/0/0").
  string derivation_path = 4;
  
  // The amount to drain. Use "all" to sweep the entire balance minus fees, 
  // or specify an exact amount in base units (e.g., satoshis or wei).
  string amount = 5;
}

/// Response indicating the outcome of the emergency drain operation.
message EmergencyDrainResponse {
  // True if the transaction was successfully built, signed, and broadcast.
  bool success = 1;
  
  // The transaction hash (TXID) of the broadcasted drain transaction.
  string tx_id = 2;
  
  // A human-readable error message if the operation failed.
  string error_message = 3;
  
  // The exact amount (in base units) that was drained.
  uint64 amount_drained = 4;
}

// ============================================================================
// 3. Frost RPCs (Used for Ed25519 / Solana DKG)
// ============================================================================

/// Request to initiate a FROST (Flexible Round-Optimized Schnorr Threshold) 
/// Distributed Key Generation ceremony for Ed25519 curves.
message StartFrostDkgRequest {}

/// Response containing the session ID for the initiated FROST DKG ceremony.
message StartFrostDkgResponse {
  // A unique UUIDv4 identifying the FROST DKG session.
  string session_id = 1;
}

// ============================================================================
// Service Definition
// ============================================================================

/// The core gRPC service orchestrating distributed MPC ceremonies and administrative operations.
service Coordinator {
  // --- Signing Operations ---
  
  /// Initiates a new threshold signing session. The API Gateway calls this to 
  /// hand off the sighash and session metadata to the Coordinator.
  rpc StartSigning(SigningRequest) returns (SigningResponse);
  
  /// Allows an MPC node to submit its partial signature share to the Coordinator 
  /// for aggregation.
  rpc ReportSignature(SignatureReport) returns (ReportAck);
  
  /// Polls for the final, aggregated threshold signature. The API Gateway calls 
  /// this repeatedly (with a backoff interval) until the Coordinator returns 
  /// the assembled signature or a timeout is reached.
  rpc GetResult(GetResultRequest) returns (SignatureResult);

  // --- Administrative / CLI Operations ---
  
  /// Initiates a new secp256k1 DKG ceremony.
  rpc StartKeygen(StartKeygenRequest) returns (StartKeygenResponse);
  
  /// Initiates a proactive key share refresh for an existing vault, providing 
  /// forward secrecy by invalidating old shares.
  rpc StartRefresh(StartRefreshRequest) returns (StartRefreshResponse);
  
  /// Initiates the CGGMP21 AuxGen phase (Paillier/RSA key generation).
  rpc StartAuxGen(StartAuxGenRequest) returns (StartAuxGenResponse);
  
  /// Fetches the current health and operational status of the cluster.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  
  /// Retrieves encrypted key share backups from all nodes for disaster recovery.
  rpc RequestBackup(RequestBackupRequest) returns (RequestBackupResponse);
  
  /// Executes a break-glass emergency drain of funds from a specified vault.
  rpc EmergencyDrain(EmergencyDrainRequest) returns (EmergencyDrainResponse);

  // --- FROST Operations ---
  
  /// Initiates an Ed25519 FROST DKG ceremony (primarily for Solana).
  rpc StartFrostDkg(StartFrostDkgRequest) returns (StartFrostDkgResponse);
}
